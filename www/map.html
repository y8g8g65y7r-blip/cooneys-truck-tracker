<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cooney's Trucking — Live Map</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15161a">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #15161a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-shrink: 0;
      flex-wrap: wrap;
      row-gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-img { height: 34px; width: auto; display: block; }
    .header-logo { font-size: 16px; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
    .live-badge {
      background: #22c55e;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn-back {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .refresh-info { font-size: 11px; color: rgba(255,255,255,0.4); }
    /* Routing degrading back to straight lines must be VISIBLE. A map that
       quietly stopped following roads looks identical to one that never did. */
    .route-notice {
      display: none;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245,158,11,0.15);
      border-radius: 5px;
      padding: 3px 8px;
    }
    .route-notice.show { display: inline-block; }
    #map { flex: 1; min-height: calc(100vh - 120px); z-index: 1; }
    .roster {
      background: #15161a;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .roster-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      color: #fff;
      font-weight: 600;
    }
    .roster-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .roster-chip .dot.offline { background: #6c757d; }
    .roster-chip .dot.idle { background: #f59e0b; }
    .roster-chip.idle { background: rgba(245,158,11,0.16); }
    .roster-chip .time { color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 400; }
    .roster-chip.idle .time { color: #fbbf24; font-weight: 700; }

    /* A stopped truck is the thing dispatch is here to notice, so it gets its
       own line above the roster rather than being one amber dot among ten. */
    .idle-strip {
      background: #78350f;
      color: #fef3c7;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      flex-shrink: 0;
    }
    .idle-strip.show { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="Cooney's" class="header-img" width="51" height="34">
      <span class="live-badge">Live</span>
    </div>
    <div class="header-right">
      <span class="route-notice" id="routeNotice"></span>
      <span class="refresh-info" id="refreshInfo">—</span>
      <a href="employees.html" class="btn-back">Employees</a>
      <a href="dispatcher.html" class="btn-back">← Dispatch</a>
    </div>
  </div>

  <div id="map"></div>

  <div class="idle-strip" id="idleStrip"></div>
  <div class="roster" id="roster"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="legs.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    let map = null
    let markers = {}
    let trailLines = {}
    let dispatchMarkers = {}
    let routeLines = {}
    // fitBounds must not fight an operator who has panned or zoomed. Auto-fit
    // only on the first render and whenever the set of things on the map changes.
    let lastBoundsKey = ''
    let hasFitOnce = false
    // Auto-follow until the operator takes control. dragstart is user-initiated
    // only (programmatic setView/fitBounds do not fire it), so this cleanly
    // distinguishes "operator is inspecting something" from "map moved itself".
    let userMoved = false

    // Leaflet applies polyline `color` via setAttribute('stroke', ...), i.e. an
    // SVG PRESENTATION ATTRIBUTE. var() there is unspecified — SVG2 as written
    // forbids it and the SVG WG only resolved to allow it in Nov 2025, with no
    // test coverage yet. Chromium and current WebKit happen to support it for
    // paint, but the iOS 14 floor is unverified and an unresolved var computes to
    // stroke:none, i.e. an INVISIBLE trail. Use the literal; keep theme.css as
    // the source of truth for every context where var() is actually specified.
    const BRAND_BLUE = '#004AAD'
    const IDLE_AMBER = '#d97706'
    // An open idle_events row whose last ping is older than this is not a
    // parked truck, it is a phone that stopped reporting — a different problem,
    // and one this flag must not silently mislabel.
    const IDLE_FRESH_MS = 12 * 60 * 1000

    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // --- Road routing (OSRM) -------------------------------------------------
    // The dashed line to a dispatch used to be a straight geometric line, which
    // in Calgary is routinely wrong by kilometres — it cuts across the Bow, the
    // rail yards and Deerfoot. This traces the actual driving route instead,
    // and gives dispatch a real road distance and drive time in the pin popup.
    //
    // router.project-osrm.org is the public demo server: free, no key, same
    // OpenStreetMap family as the Nominatim geocoding dispatcher.html already
    // uses. It is explicitly NOT built for production traffic, so everything
    // below exists to keep this fleet's load negligible and to degrade to the
    // old straight line the moment it stops answering.
    const OSRM_BASE = 'https://router.project-osrm.org/route/v1/driving/'
    const ROUTE_TIMEOUT_MS = 6000
    // A truck that has not moved 500m does not need a new route, and no job is
    // re-routed more than once a minute however fast it is moving. A parked
    // truck therefore costs zero requests, and a full fleet of 5 moving trucks
    // costs at most 5 requests/minute.
    const ROUTE_MIN_REFRESH_MS = 60 * 1000
    const ROUTE_MOVE_THRESHOLD_M = 500
    // Throttled or down: stop asking for a while rather than hammering it, and
    // SAY SO in the header — a silently degraded map that quietly went back to
    // straight lines would be worse than no feature at all.
    const ROUTE_FAIL_LIMIT = 3
    const ROUTE_BACKOFF_MS = 5 * 60 * 1000

    const routeCache = {}   // dispatch id -> { latlngs, from, to, at, distanceM, durationS }
    const truckPos = {}     // dispatch id -> the truck's latest [lat, lng]
    let routeQueue = []
    let routePumping = false
    let routeFailures = 0
    let routeBlockedUntil = 0

    function metres(aLat, aLng, bLat, bLng) {
      return (window.TruckLegs && TruckLegs.haversine)
        ? TruckLegs.haversine(aLat, aLng, bLat, bLng)
        : Number.POSITIVE_INFINITY
    }

    function setRouteNotice() {
      const el = document.getElementById('routeNotice')
      const blocked = Date.now() < routeBlockedUntil
      el.textContent = blocked ? 'Road routing unavailable — showing direct lines' : ''
      el.classList.toggle('show', blocked)
    }

    function noteRouteFailure(reason) {
      routeFailures++
      if (routeFailures >= ROUTE_FAIL_LIMIT) {
        routeBlockedUntil = Date.now() + ROUTE_BACKOFF_MS
        routeQueue = []
        console.warn(`Road routing disabled for 5 min after ${routeFailures} failures (${reason}). Falling back to direct lines.`)
        setRouteNotice()
      }
    }

    function queueRoute(id, from, to) {
      if (Date.now() < routeBlockedUntil) return
      const c = routeCache[id]
      if (c) {
        // A pin dropped somewhere unroutable is not a server problem — never
        // ask again for that job.
        if (c.unroutable && metres(c.to.lat, c.to.lng, to.lat, to.lng) < 1) return
        if (Date.now() - c.at < ROUTE_MIN_REFRESH_MS) return
        const destMoved = metres(c.to.lat, c.to.lng, to.lat, to.lng) >= 1
        const truckMoved = metres(c.from.lat, c.from.lng, from.lat, from.lng) >= ROUTE_MOVE_THRESHOLD_M
        if (!destMoved && !truckMoved) return
      }
      if (routeQueue.some(q => q.id === id)) return
      routeQueue.push({ id: id, from: from, to: to })
      pumpRouteQueue()
    }

    // One request at a time with a gap between them. Five parallel requests on
    // every 15s refresh is exactly the burst pattern the demo server rate-limits.
    async function pumpRouteQueue() {
      if (routePumping) return
      routePumping = true
      try {
        while (routeQueue.length) {
          if (Date.now() < routeBlockedUntil) { routeQueue = []; break }
          const job = routeQueue.shift()
          const ok = await fetchRoute(job)
          await new Promise(r => setTimeout(r, ok ? 350 : 1200))
        }
      } finally {
        routePumping = false
      }
    }

    async function fetchRoute(job) {
      // OSRM takes lon,lat — the opposite order to Leaflet. Getting this
      // backwards silently returns a route somewhere off the coast of Africa.
      const coords = `${job.from.lng},${job.from.lat};${job.to.lng},${job.to.lat}`
      const url = `${OSRM_BASE}${coords}?overview=full&geometries=geojson&alternatives=false&steps=false`
      const ctrl = new AbortController()
      const timer = setTimeout(() => ctrl.abort(), ROUTE_TIMEOUT_MS)
      try {
        const res = await fetch(url, { signal: ctrl.signal })
        if (res.status === 429 || res.status === 503) { noteRouteFailure('rate limited'); return false }
        if (!res.ok) { noteRouteFailure('HTTP ' + res.status); return false }
        const j = await res.json()
        if (j.code !== 'Ok' || !j.routes || !j.routes.length || !j.routes[0].geometry) {
          // Genuinely no road route (a pin in the middle of a field). Remember
          // that so the straight line stands and we stop asking.
          routeCache[job.id] = { latlngs: null, unroutable: true, from: job.from, to: job.to, at: Date.now() }
          routeFailures = 0
          return true
        }
        const r = j.routes[0]
        routeCache[job.id] = {
          latlngs: r.geometry.coordinates.map(c => [c[1], c[0]]),
          from: job.from, to: job.to, at: Date.now(),
          distanceM: r.distance, durationS: r.duration
        }
        routeFailures = 0
        applyRoute(job.id)
        return true
      } catch (e) {
        noteRouteFailure(e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'network')
        return false
      } finally {
        clearTimeout(timer)
      }
    }

    // The cached route starts wherever the truck was when it was fetched. Snap
    // to the nearest point on it and draw from the truck's CURRENT position, so
    // the line stays attached to the marker instead of trailing a stub behind.
    function routeFrom(latlngs, lat, lng) {
      let best = 0, bestD = Infinity
      for (let i = 0; i < latlngs.length; i++) {
        const d = metres(lat, lng, latlngs[i][0], latlngs[i][1])
        if (d < bestD) { bestD = d; best = i }
      }
      return [[lat, lng]].concat(latlngs.slice(best))
    }

    function applyRoute(id) {
      const c = routeCache[id]
      const t = truckPos[id]
      if (!c || !c.latlngs || !routeLines[id] || !t) return
      // Only the line is redrawn here. The popup is rebuilt wholesale on the
      // next 15s refresh, which picks the distance/ETA up from the cache —
      // string-surgery on live popup HTML to save 15 seconds is not worth the
      // fragility.
      routeLines[id].setLatLngs(routeFrom(c.latlngs, t[0], t[1]))
    }

    function fmtEta(seconds) {
      const m = Math.round(seconds / 60)
      if (m < 60) return m + ' min'
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
    }

    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = 'index.html'; return }
      const { data: profile } = await sb.from('profiles').select('role').eq('id', session.user.id).single()
      if (profile?.role !== 'admin' && profile?.role !== 'dispatcher') { window.location.href = 'dashboard.html'; return }
      initMap()
      loadLocations()
      setInterval(loadLocations, 15000)
    })

    function initMap() {
      map = L.map('map').setView([51.0447, -114.0719], 11) // Default: Calgary
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map)
      map.on('dragstart', () => { userMoved = true })
    }

    const LIVE_MS = 5 * 60 * 1000 // pinged within 5 min = "Live"

    function relTime(ms) {
      const m = Math.round(ms / 60000)
      if (m < 1) return 'just now'
      if (m < 60) return m + ' min ago'
      const h = Math.round(m / 60)
      return h + (h === 1 ? ' hr ago' : ' hrs ago')
    }

    const TRAIL_MS = 3 * 60 * 60 * 1000 // breadcrumb trail covers the last 3h of driving, not the full 24h window

    async function loadLocations() {
      // Show each driver's LAST KNOWN location from the last 24h, so a parked or
      // paused truck (the native app only pings when it moves ~40m) stays on the
      // map at its last spot instead of vanishing after 5 minutes. Freshness is
      // shown by colour: live = brand blue, stale = grey.
      const dayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()

      const [locRes, profRes, dispRes, idleRes] = await Promise.all([
        sb.from('location_updates')
          .select('*')
          .gte('created_at', dayAgo)
          .order('created_at', { ascending: false }),
        sb.from('profiles').select('id, full_name, unit_number').eq('role', 'driver'),
        // NOT time-bounded: dispatcher.html lists every active job regardless of
        // age, and a map that silently omits one the board still shows is worse
        // than a stale pin. Ageing stale jobs out belongs in a server-side sweep.
        sb.from('dispatches').select('*').eq('status', 'active'),
        // Open idle events, written by the check-idle-drivers cron. Read, not
        // computed: the detection has to run whether or not this page is open.
        sb.from('idle_events').select('user_id, started_at, last_ping_at, notified_at').is('ended_at', null)
      ])

      // supabase-js RESOLVES with {data:null, error} on failure. Rendering that
      // would clear every truck, trail and pin off the board on a single blip,
      // so keep whatever is already drawn and wait for the next 15s refresh.
      if (locRes.error || profRes.error || dispRes.error) {
        console.error('Map refresh failed', locRes.error || profRes.error || dispRes.error)
        return
      }
      const locData = locRes.data
      const profileData = profRes.data
      const dispatchData = dispRes.data
      // Non-fatal on its own: an idle_events failure (or a project where 0006
      // has not run yet) must not blank the whole board. Degrade to no flags.
      if (idleRes.error) console.error('Idle events unavailable', idleRes.error)
      const idleByUser = {}
      ;(idleRes.data || []).forEach(e => {
        if (Date.now() - new Date(e.last_ping_at).getTime() > IDLE_FRESH_MS) return
        idleByUser[e.user_id] = {
          minutes: Math.max(0, Math.round((new Date(e.last_ping_at) - new Date(e.started_at)) / 60000)),
          notified: !!e.notified_at
        }
      })

      const profileMap = {}
      profileData?.forEach(p => { profileMap[p.id] = p })

      // Latest location per driver within the window, plus the recent trail
      // (last TRAIL_MS) per driver in chronological order for the breadcrumb line.
      const latestByUser = {}
      const trailByUser = {}
      const now = Date.now()
      ;(locData || []).forEach(loc => {
        if (!latestByUser[loc.user_id]) latestByUser[loc.user_id] = loc
        if (now - new Date(loc.created_at).getTime() < TRAIL_MS) {
          (trailByUser[loc.user_id] = trailByUser[loc.user_id] || []).push(loc)
        }
      })
      Object.values(trailByUser).forEach(pts => pts.reverse()) // oldest -> newest for the polyline

      const shownIds = new Set(Object.keys(latestByUser))

      // Remove markers/trails for drivers with no ping in the last 24h.
      Object.keys(markers).forEach(uid => {
        if (!shownIds.has(uid)) { map.removeLayer(markers[uid]); delete markers[uid] }
      })
      Object.keys(trailLines).forEach(uid => {
        if (!shownIds.has(uid)) { map.removeLayer(trailLines[uid]); delete trailLines[uid] }
      })

      // Breadcrumb trails — faint brand-blue line through each driver's recent
      // pings. Update coordinates in place rather than destroying and rebuilding
      // every polyline each cycle; trails can run to hundreds of points.
      shownIds.forEach(uid => {
        const pts = (trailByUser[uid] || []).map(p => [parseFloat(p.lat), parseFloat(p.lng)])
        if (pts.length > 1) {
          if (trailLines[uid]) trailLines[uid].setLatLngs(pts)
          else trailLines[uid] = L.polyline(pts, { color: BRAND_BLUE, weight: 3, opacity: 0.35 }).addTo(map)
        } else if (trailLines[uid]) {
          map.removeLayer(trailLines[uid]); delete trailLines[uid]
        }
      })

      const bounds = []
      shownIds.forEach(uid => {
        const loc = latestByUser[uid]
        const profile = profileMap[uid]
        const unit = profile?.unit_number || '?'
        const name = profile?.full_name || 'Unknown'
        const lat = parseFloat(loc.lat)
        const lng = parseFloat(loc.lng)
        const ageMs = now - new Date(loc.created_at).getTime()
        const isLive = ageMs < LIVE_MS
        const idle = isLive ? idleByUser[uid] : null
        // Three states, not two: reporting and moving (brand blue), reporting
        // but parked past the threshold (amber), not reporting at all (grey).
        // Conflating the last two is exactly what made a parked truck and a
        // dead phone look identical before the heartbeat existed.
        const color = idle ? IDLE_AMBER : (isLive ? 'var(--brand-blue)' : '#6c757d')
        const timeStr = new Date(loc.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        const speedStr = loc.speed != null ? ` · ${Math.round(loc.speed * 3.6)} km/h` : ''
        const freshStr = idle ? `Parked ${idle.minutes} min` : (isLive ? 'Live now' : 'Last seen ' + relTime(ageMs))

        const icon = L.divIcon({
          className: '',
          html: `<div style="background:${color};color:#ffffff;border:3px solid #ffffff;border-radius:50% 50% 50% 0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transform:rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4);${isLive ? '' : 'opacity:0.7'}"><span style="transform:rotate(45deg)">${escapeHtml(unit)}</span></div>`,
          iconSize: [38, 38],
          iconAnchor: [8, 38]
        })

        const popup = `<b>Unit ${escapeHtml(unit)}</b> — ${escapeHtml(name)}<br>${freshStr} (${timeStr})${speedStr}<br>±${Math.round(loc.accuracy || 0)}m accuracy`
          + (idle ? `<br><b style="color:#b45309">Not moved for ${idle.minutes} min</b>${idle.notified ? ' — driver alerted' : ''}` : '')

        if (markers[uid]) {
          markers[uid].setLatLng([lat, lng])
          markers[uid].setPopupContent(popup)
          markers[uid].setIcon(icon)
        } else {
          markers[uid] = L.marker([lat, lng], { icon }).addTo(map).bindPopup(popup)
        }
        bounds.push([lat, lng])
      })

      // Dispatch destination pins — distinct teardrop markers (vs. the trucks'
      // rotated-square icons) so a dispatcher can see where each active job is
      // headed. Amber while pending, green once the driver taps Accept. A
      // dashed line ties the pin back to that driver's current truck position.
      const activeDispatchIds = new Set()
      ;(dispatchData || []).forEach(d => {
        if (d.lat == null || d.lng == null) return
        activeDispatchIds.add(d.id)
        const driver = profileMap[d.driver_id]
        const unit = driver?.unit_number || '?'
        const name = driver?.full_name || 'Unknown'
        const accepted = !!d.accepted_at
        const color = accepted ? '#22c55e' : '#eab308'
        const lat = parseFloat(d.lat)
        const lng = parseFloat(d.lng)

        const icon = L.divIcon({
          className: '',
          html: `<div style="background:${color};color:#ffffff;border:3px solid #ffffff;border-radius:50% 50% 50% 0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;transform:rotate(45deg);box-shadow:0 2px 8px rgba(0,0,0,0.4);"><span style="transform:rotate(-45deg)">🚩</span></div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 32]
        })
        const cached = routeCache[d.id]
        // Road distance and drive time, straight off the route we already
        // fetched — the single most useful thing on this popup for a
        // dispatcher deciding who to send next.
        const etaStr = (cached && cached.latlngs && cached.distanceM != null)
          ? `<br><b>${(cached.distanceM / 1000).toFixed(1)} km · ${fmtEta(cached.durationS)}</b> by road`
          : ''
        const popup = `<b>${accepted ? '✓ Accepted' : 'Pending'}</b> — Unit ${escapeHtml(unit)} (${escapeHtml(name)})<br>${escapeHtml(d.site_address)}${d.notes ? '<br>' + escapeHtml(d.notes) : ''}${etaStr}`

        if (dispatchMarkers[d.id]) {
          dispatchMarkers[d.id].setIcon(icon)
          dispatchMarkers[d.id].setPopupContent(popup)
        } else {
          dispatchMarkers[d.id] = L.marker([lat, lng], { icon }).addTo(map).bindPopup(popup)
        }
        bounds.push([lat, lng])

        const truckLoc = latestByUser[d.driver_id]
        if (truckLoc) {
          const tLat = parseFloat(truckLoc.lat)
          const tLng = parseFloat(truckLoc.lng)
          // Draw immediately from whatever we have — the road route if it is
          // already cached, otherwise the straight line. The routing call never
          // gates the map: it upgrades the line in place when it lands, and if
          // it never lands the straight line is simply what stays on screen.
          const pts = (cached && cached.latlngs)
            ? routeFrom(cached.latlngs, tLat, tLng)
            : [[tLat, tLng], [lat, lng]]
          if (routeLines[d.id]) {
            routeLines[d.id].setLatLngs(pts)
            routeLines[d.id].setStyle({ color })
          } else {
            routeLines[d.id] = L.polyline(pts, { color, weight: 3, opacity: 0.65, dashArray: '8,7' }).addTo(map)
          }
          // Remember where the truck is now so a route arriving asynchronously
          // snaps to the current position rather than a stale one.
          truckPos[d.id] = [tLat, tLng]
          queueRoute(d.id, { lat: tLat, lng: tLng }, { lat: lat, lng: lng })
        } else if (routeLines[d.id]) {
          map.removeLayer(routeLines[d.id]); delete routeLines[d.id]
        }
      })
      Object.keys(dispatchMarkers).forEach(id => {
        if (!activeDispatchIds.has(id)) { map.removeLayer(dispatchMarkers[id]); delete dispatchMarkers[id] }
      })
      Object.keys(routeLines).forEach(id => {
        if (!activeDispatchIds.has(id)) { map.removeLayer(routeLines[id]); delete routeLines[id] }
      })
      // Drop cached routes for finished jobs so this cannot grow all day.
      Object.keys(routeCache).forEach(id => {
        if (!activeDispatchIds.has(id)) { delete routeCache[id]; delete truckPos[id] }
      })
      setRouteNotice()

      // Auto-fit on the first render, when the SET of trucks/jobs changes, and —
      // only while the operator has not panned — when something has driven out of
      // view. Re-fitting unconditionally every 15s snapped the view back and made
      // close-up monitoring impossible.
      const boundsKey = Array.from(shownIds).sort().join(',') + '|' + Array.from(activeDispatchIds).sort().join(',')
      const drovenOutOfView = !userMoved && bounds.length > 0 &&
        !bounds.every(p => map.getBounds().contains(p))
      if (bounds.length && (!hasFitOnce || boundsKey !== lastBoundsKey || drovenOutOfView)) {
        if (bounds.length === 1) map.setView(bounds[0], 14)
        else map.fitBounds(bounds, { padding: [40, 40] })
        hasFitOnce = true
      }
      lastBoundsKey = boundsKey

      // Roster strip — same set; Live if pinged within 5 min, else last-seen time.
      const roster = document.getElementById('roster')
      const rosterUsers = Object.keys(latestByUser)
      if (rosterUsers.length === 0) {
        roster.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:12px;">No trucks have tracked today</span>'
      } else {
        roster.innerHTML = rosterUsers.map(uid => {
          const loc = latestByUser[uid]
          const active = (now - new Date(loc.created_at).getTime()) < LIVE_MS
          const idle = active ? idleByUser[uid] : null
          const profile = profileMap[uid]
          const unit = profile?.unit_number || '?'
          const name = profile?.full_name || 'Unknown'
          const timeStr = new Date(loc.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          return `<div class="roster-chip${idle ? ' idle' : ''}">
            <div class="dot${idle ? ' idle' : (active ? '' : ' offline')}"></div>
            Unit ${escapeHtml(unit)} — ${escapeHtml(name)}
            <span class="time">${idle ? 'Parked ' + idle.minutes + 'm' : (active ? 'Live' : timeStr)}</span>
          </div>`
        }).join('')
      }

      // One clear line for the thing dispatch is actually watching for.
      const idleList = rosterUsers
        .filter(uid => idleByUser[uid] && (now - new Date(latestByUser[uid].created_at).getTime()) < LIVE_MS)
        .map(uid => 'Unit ' + ((profileMap[uid] || {}).unit_number || '?') + ' (' + idleByUser[uid].minutes + ' min)')
      const strip = document.getElementById('idleStrip')
      if (idleList.length) {
        strip.textContent = (idleList.length === 1 ? 'Stopped: ' : 'Stopped (' + idleList.length + '): ') + idleList.join(', ')
        strip.classList.add('show')
      } else {
        strip.classList.remove('show')
      }

      document.getElementById('refreshInfo').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
    }
  </script>
</body>
</html>
