<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cooney's Trucking — My Truck</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #15161a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-img { height: 34px; width: auto; display: block; }
    .header-logo { font-size: 16px; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
    .unit-badge {
      background: var(--brand-blue);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .btn-signout {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 40px;
      gap: 22px;
    }

    .status-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 4px solid rgba(255,255,255,0.1);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .status-ring.active {
      border-color: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.4);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      70%  { box-shadow: 0 0 0 20px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .status-icon { font-size: 36px; }
    .status-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-ring.active .status-label { color: #22c55e; }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      width: 100%;
      max-width: 400px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 800;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .dispatch-address {
      font-size: 17px;
      font-weight: 700;
      color: #15161a;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
    .dispatch-notes {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 4px;
    }
    .dispatch-empty {
      font-size: 14px;
      color: #9aa0a6;
      text-align: center;
      padding: 8px 0;
    }
    .accept-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0fdf4;
      color: #16a34a;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 9px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .card.dispatch-accepted { box-shadow: 0 0 0 2px #22c55e, 0 2px 10px rgba(0,0,0,0.06); }
    /* Buttons now live inside a dispatch card, which is already max-width 400
       and supplies the spacing — so no max-width and no negative margin here. */
    /* 20px, not 10px: these are tapped in a moving truck, and WCAG 2.5.8 wants
       at least 24px of target spacing. Mark Job Complete gets extra separation
       on top (see .btn-complete) because it is irreversible from the driver UI. */
    .card-actions { display: flex; flex-direction: column; gap: 20px; margin-top: 14px; }
    .btn-accept {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      /* Darker than the original #22c55e: that was chosen against the dark page
         shell (7.93:1 edge contrast). On the white card it fell to 2.28:1 — a
         pale slab in cab sunlight. #15803d restores 5.01:1 for both the edge and
         the white label. The old green is now the pressed state. */
      background: #15803d;
      color: #ffffff;
    }
    .btn-accept:active { background: #22c55e; }
    /* Solid fill, never opacity: compositing the button over the white card
       dropped the "Accepting..." label to 1.67:1 and the driver could not tell
       the tap had registered. */
    .btn-accept:disabled { background: #14532d; color: #ffffff; cursor: not-allowed; }

    /* Only shown when a driver has more than one open job, so the older one
       can never become unreachable. */
    .dispatch-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .job-count {
      width: 100%;
      max-width: 400px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .offline-note {
      width: 100%;
      max-width: 400px;
      background: rgba(234,179,8,0.15);
      color: #fde047;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }
    .offline-note.show { display: block; }

    .history-toggle {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    .history-list { width: 100%; max-width: 400px; display: none; }
    .history-list.open { display: block; }
    .history-item {
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }
    .history-item .addr { font-weight: 700; color: #fff; margin-bottom: 2px; }
    .history-item .meta { color: rgba(255,255,255,0.4); }
    .history-item .status-cancelled { color: #f87171; }

    .btn-directions {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      background: var(--brand-blue);
      color: #ffffff;
    }
    .btn-directions:active { background: var(--brand-blue-hover); }

    .btn-complete {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      /* Sits on the WHITE dispatch card, not the dark page shell — a
         translucent-white fill with white text would be invisible here. */
      background: #f4f5f7;
      color: #15161a;
      /* Extra separation from Get Directions: irreversible, and reached for
         while the truck is moving. ~34px total from the button above. */
      margin-top: 14px;
    }
    .btn-complete:active { background: #e4e6ea; }
    .btn-complete:disabled { background: #e4e6ea; color: #15161a; cursor: not-allowed; }

    .btn-track-toggle {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 4px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      width: 100%;
      max-width: 400px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="Cooney's" class="header-img" width="51" height="34">
      <span class="unit-badge" id="unitBadge">UNIT —</span>
    </div>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </div>

  <div class="main">

    <div class="status-ring" id="statusRing">
      <div class="status-icon">📍</div>
      <div class="status-label" id="statusLabel">Starting...</div>
    </div>

    <div class="info-row">
      <span>Driver: <span id="infoName">—</span></span>
      <span id="infoLastSent">—</span>
    </div>

    <div class="offline-note" id="offlineNote">Offline — showing your last known jobs, retrying...</div>
    <div class="job-count" id="jobCount" style="display:none;"></div>
    <div class="dispatch-list" id="dispatchList">
      <div class="card">
        <div class="card-title">Current Dispatch</div>
        <div class="dispatch-empty">Loading...</div>
      </div>
    </div>

    <button class="btn-track-toggle" id="trackToggle" onclick="toggleTracking()">Pause GPS tracking</button>
    <button class="history-toggle" id="historyToggle" onclick="toggleHistory()">View recent jobs</button>
    <div class="history-list" id="historyList"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
    const BackgroundGeolocation = isNative ? window.Capacitor.Plugins.BackgroundGeolocation : null
    const PushNotifications = isNative ? window.Capacitor.Plugins.PushNotifications : null
    let currentUser = null
    let historyLoaded = false
    let tracking = false
    let watchId = null
    let bgWatcherId = null
    let sendInterval = null
    let wakeLock = null
    let lastPosition = null
    // ALL open jobs, not just the newest — a second dispatch must never hide the
    // first. Renders as a single card when there is only one, as today.
    let activeDispatches = []
    // Monotonic guard: realtime, the 30s poll and post-action reloads can all be
    // in flight at once, and a slow earlier response must not overwrite a newer one.
    let loadSeq = 0
    let dispatchChannel = null
    // Set from a notification tap so we scroll to the job the driver chose.
    let focusDispatchId = null
    // Re-rendering rebuilds innerHTML and destroys any in-progress button state
    // ("Accepting...", disabled). The 30s poll and realtime both call in, so skip
    // the rebuild when nothing the driver can see has actually changed.
    let lastRenderSig = ''
    let hasRenderedOnce = false
    // The APNs token THIS install registered. Sign-out only ever clears its own
    // device's token — a browser or Android session must not wipe the token an
    // iPhone registered, because the iPhone only rewrites it on app launch.
    let myPushToken = null

    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = 'index.html'; return }
      currentUser = session.user
      const { data: profile } = await sb.from('profiles').select('full_name, unit_number, role').eq('id', session.user.id).single()
      if (profile?.role === 'admin' || profile?.role === 'dispatcher') { window.location.href = 'dispatcher.html'; return }
      document.getElementById('infoName').textContent = profile?.full_name || 'Unknown'
      document.getElementById('unitBadge').textContent = 'UNIT ' + (profile?.unit_number || '—')
      loadDispatch()
      setInterval(loadDispatch, 30000)
      startTracking()
      registerPush()

      // Realtime: reflect a new dispatch or a dispatcher-side change the moment
      // it happens, instead of waiting up to 30s for the next poll.
      dispatchChannel = sb.channel('dispatches-driver-' + currentUser.id)
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'dispatches',
          filter: 'driver_id=eq.' + currentUser.id
        }, () => { historyLoaded = false; loadDispatch() })
        .subscribe()
    })

    window.addEventListener('pagehide', () => {
      if (dispatchChannel) { sb.removeChannel(dispatchChannel); dispatchChannel = null }
    })

    function setOffline(on, msg) {
      const el = document.getElementById('offlineNote')
      el.textContent = msg || 'Offline — showing your last known jobs, retrying...'
      el.classList.toggle('show', !!on)
    }

    async function registerPush() {
      if (!isNative || !PushNotifications) return
      // Push is iOS-only. The Edge Function speaks APNs, and there is no
      // google-services.json wired up for FCM — on Android register() throws
      // inside Firebase init and the catch below would swallow it silently.
      // Note POST_NOTIFICATIONS is already granted for the GPS foreground
      // service, so the permission check below would NOT have caught this.
      const platform = window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : ''
      if (platform !== 'ios') return
      try {
        let perm = await PushNotifications.checkPermissions()
        if (perm.receive !== 'granted') perm = await PushNotifications.requestPermissions()
        if (perm.receive !== 'granted') return

        PushNotifications.addListener('registration', async (token) => {
          myPushToken = token.value
          await sb.from('profiles').update({ push_token: token.value }).eq('id', currentUser.id)
        })
        PushNotifications.addListener('registrationError', (err) => {
          console.error('Push registration error', err)
        })
        PushNotifications.addListener('pushNotificationReceived', () => loadDispatch())
        // Open the job the driver actually tapped. The payload carries
        // dispatch_id precisely so this doesn't fall back to "whichever is newest".
        PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
          const id = action && action.notification && action.notification.data
            ? action.notification.data.dispatch_id
            : null
          if (id) focusDispatchId = id
          loadDispatch()
        })

        await PushNotifications.register()
      } catch (e) {
        console.error('Could not set up push notifications', e)
      }
    }

    async function loadDispatch() {
      const seq = ++loadSeq
      const { data, error } = await sb.from('dispatches')
        .select('*')
        .eq('driver_id', currentUser.id)
        .eq('status', 'active')
        .order('created_at', { ascending: false })
        .limit(20)

      // A newer load already rendered — discard this stale response.
      if (seq !== loadSeq) return

      // supabase-js RESOLVES with {data:null, error} on a network failure rather
      // than throwing. Rendering that as "no dispatch" would wipe a real job off
      // the screen of a driver in a dead zone, so keep the last known state.
      if (error) {
        setOffline(true)
        // On a cold start with no signal there is nothing to preserve, and the
        // placeholder would otherwise read "Loading..." forever.
        if (!hasRenderedOnce) {
          document.getElementById('dispatchList').innerHTML =
            '<div class="card"><div class="card-title">Current Dispatch</div><div class="dispatch-empty">No connection — retrying every 30s.</div></div>'
        }
        return
      }

      setOffline(false)
      activeDispatches = data || []
      renderDispatches()
    }

    function renderDispatches() {
      const list = document.getElementById('dispatchList')
      const countEl = document.getElementById('jobCount')

      const sig = JSON.stringify(activeDispatches.map(d => [d.id, d.accepted_at, d.site_address, d.notes, d.lat, d.lng]))
      if (sig === lastRenderSig && hasRenderedOnce && !focusDispatchId) return
      lastRenderSig = sig
      hasRenderedOnce = true

      if (activeDispatches.length === 0) {
        focusDispatchId = null
        countEl.style.display = 'none'
        list.innerHTML = '<div class="card"><div class="card-title">Current Dispatch</div><div class="dispatch-empty">No dispatch assigned</div></div>'
        return
      }

      const many = activeDispatches.length > 1
      countEl.style.display = many ? 'block' : 'none'
      countEl.textContent = activeDispatches.length + ' open jobs'

      list.innerHTML = activeDispatches.map((d, i) => {
        const accepted = !!d.accepted_at
        const id = escapeHtml(d.id)
        return `
          <div class="card ${accepted ? 'dispatch-accepted' : ''}" data-dispatch="${id}">
            <div class="card-title">${many ? 'Job ' + (i + 1) : 'Current Dispatch'}</div>
            ${accepted ? '<div class="accept-badge">✓ Accepted</div>' : ''}
            <div class="dispatch-address">${escapeHtml(d.site_address)}</div>
            ${d.notes ? `<div class="dispatch-notes">${escapeHtml(d.notes)}</div>` : ''}
            <div class="card-actions">
              ${accepted ? '' : `<button class="btn-accept" data-action="accept" data-id="${id}">Accept Dispatch</button>`}
              <button class="btn-directions" data-action="directions" data-id="${id}">Get Directions</button>
              <button class="btn-complete" data-action="complete" data-id="${id}">Mark Job Complete</button>
            </div>
          </div>
        `
      }).join('')

      if (focusDispatchId) {
        for (const el of list.children) {
          if (el.dataset.dispatch === focusDispatchId) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' })
            break
          }
        }
      }
      // Cleared on every render path, so a tap can never be applied to an
      // unrelated later render.
      focusDispatchId = null
    }

    // Delegated: values go in data-* attributes rather than being interpolated
    // into an inline onclick. HTML-escaping does not make a value safe inside a
    // JS string literal — the parser decodes entities before the JS is compiled.
    document.getElementById('dispatchList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]')
      if (!btn) return
      const id = btn.dataset.id
      if (btn.dataset.action === 'accept') acceptDispatch(id, btn)
      else if (btn.dataset.action === 'directions') getDirections(id)
      else if (btn.dataset.action === 'complete') markComplete(id, btn)
    })

    async function acceptDispatch(id, btn) {
      const d = activeDispatches.find(x => x.id === id)
      if (!d) return
      btn.disabled = true
      btn.textContent = 'Accepting...'
      const { error } = await sb.from('dispatches')
        .update({ accepted_at: new Date().toISOString() })
        .eq('id', id)
      if (error) {
        btn.disabled = false
        btn.textContent = 'Accept Dispatch'
        setOffline(true, 'Could not accept — no connection. Try again when you have signal.')
        return
      }
      setOffline(false)
      // Re-find rather than mutating the captured `d`: a concurrent load may have
      // replaced activeDispatches while the update was in flight, which would
      // leave the optimistic accept on an orphaned object and never render.
      const cur = activeDispatches.find(x => x.id === id)
      if (cur) cur.accepted_at = new Date().toISOString()
      renderDispatches()
      loadDispatch()
    }

    async function toggleHistory() {
      const list = document.getElementById('historyList')
      const open = list.classList.toggle('open')
      document.getElementById('historyToggle').textContent = open ? 'Hide recent jobs' : 'View recent jobs'
      if (open && !historyLoaded) await loadHistory()
    }

    async function loadHistory() {
      const list = document.getElementById('historyList')
      list.innerHTML = '<div class="history-item">Loading...</div>'
      const { data, error } = await sb.from('dispatches')
        .select('*')
        .eq('driver_id', currentUser.id)
        .in('status', ['completed', 'cancelled'])
        .order('created_at', { ascending: false })
        .limit(10)

      if (error) {
        list.innerHTML = '<div class="history-item">Could not load recent jobs — tap again when you have signal.</div>'
        return
      }
      historyLoaded = true
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="history-item">No past jobs yet</div>'
        return
      }
      list.innerHTML = data.map(d => {
        const timeStr = new Date(d.completed_at || d.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const statusStr = d.status === 'cancelled' ? '<span class="status-cancelled">Cancelled</span>' : 'Completed'
        return `
          <div class="history-item">
            <div class="addr">${escapeHtml(d.site_address)}</div>
            <div class="meta">${statusStr} · ${timeStr}</div>
          </div>
        `
      }).join('')
    }

    function getDirections(id) {
      const d = activeDispatches.find(x => x.id === id)
      if (!d) return
      const dest = (d.lat != null && d.lng != null)
        ? `${d.lat},${d.lng}`
        : encodeURIComponent(d.site_address)
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}`, '_blank')
    }

    async function markComplete(id, btn) {
      if (!activeDispatches.some(x => x.id === id)) return
      // Irreversible from the driver UI and sits directly under Get Directions,
      // which is reached for while moving. Matches dispatcher.html's Cancel.
      if (!confirm('Mark this job complete?')) return
      btn.disabled = true
      btn.textContent = 'Marking complete...'
      const { error } = await sb.from('dispatches')
        .update({ status: 'completed', completed_at: new Date().toISOString() })
        .eq('id', id)
      if (error) {
        btn.disabled = false
        btn.textContent = 'Mark Job Complete'
        setOffline(true, 'Could not mark complete — no connection. Try again when you have signal.')
        return
      }
      setOffline(false)
      historyLoaded = false
      activeDispatches = activeDispatches.filter(x => x.id !== id)
      renderDispatches()
      loadDispatch()
    }

    async function toggleTracking() {
      tracking ? stopTracking() : startTracking()
    }

    async function startTracking() {
      // Native app (installed on the phone): real background tracking via the
      // OS location service, keeps running with the screen off / app closed.
      if (isNative && BackgroundGeolocation) {
        try {
          bgWatcherId = await BackgroundGeolocation.addWatcher(
            {
              backgroundTitle: 'Tracking your truck',
              backgroundMessage: "Cooney's Truck Tracker is running. Tap to open.",
              requestPermissions: true,
              stale: false,
              // Metres between updates, not a fixed timer — fires roughly every
              // 3-10s at normal driving speeds, and goes quiet automatically
              // while parked instead of draining the battery for no reason.
              distanceFilter: 40
            },
            (location, error) => {
              if (error) {
                if (error.code === 'NOT_AUTHORIZED') {
                  if (confirm("This app needs location access to track your truck. Open settings now?")) {
                    BackgroundGeolocation.openSettings()
                  }
                }
                document.getElementById('statusLabel').textContent = 'GPS error'
                return
              }
              if (!tracking) firstActivate()
              sendLocation({
                coords: {
                  latitude: location.latitude,
                  longitude: location.longitude,
                  accuracy: location.accuracy,
                  speed: location.speed,
                  heading: location.bearing
                }
              })
            }
          )
          tracking = true
          document.getElementById('trackToggle').textContent = 'Pause GPS tracking'
        } catch (e) {
          alert('Could not start location tracking: ' + e.message)
        }
        return
      }

      // Browser fallback (testing on the web build): foreground-only, screen
      // must stay on and the tab open — the wake lock keeps the screen alive.
      if (!navigator.geolocation) {
        alert('GPS is not available on this device.')
        return
      }

      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen')
      } catch (e) {}

      watchId = navigator.geolocation.watchPosition(
        pos => {
          lastPosition = pos
          if (!tracking) firstActivate()
          sendLocation(pos)
        },
        err => {
          document.getElementById('statusLabel').textContent = 'GPS error'
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
      )

      sendInterval = setInterval(() => {
        if (lastPosition) sendLocation(lastPosition)
      }, 20000)

      tracking = true
      document.getElementById('trackToggle').textContent = 'Pause GPS tracking'
    }

    function firstActivate() {
      document.getElementById('statusRing').classList.add('active')
      document.getElementById('statusLabel').textContent = 'Live'
    }

    async function stopTracking() {
      if (isNative && BackgroundGeolocation && bgWatcherId) {
        try { await BackgroundGeolocation.removeWatcher({ id: bgWatcherId }) } catch (e) {}
        bgWatcherId = null
      }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId)
      if (sendInterval) clearInterval(sendInterval)
      if (wakeLock) { try { wakeLock.release() } catch(e) {} wakeLock = null }
      tracking = false
      watchId = null
      sendInterval = null
      lastPosition = null
      document.getElementById('statusRing').classList.remove('active')
      document.getElementById('statusLabel').textContent = 'Paused'
      document.getElementById('trackToggle').textContent = 'Resume GPS tracking'
    }

    async function sendLocation(pos) {
      const { error } = await sb.from('location_updates').insert({
        user_id: currentUser.id,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        speed: pos.coords.speed,
        heading: pos.coords.heading
      })
      if (!error) {
        document.getElementById('infoLastSent').textContent = 'Last ping ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    }

    async function signOut() {
      await stopTracking()
      // Release this device's push token. An APNs token identifies the app
      // INSTALL, not the user — on a shared cab phone the next driver to sign in
      // would otherwise inherit our notifications, and we'd stop getting ours.
      // Time-boxed: a driver on a dead connection must still be able to sign out.
      // If the clear does not land, the token is overwritten on the next sign-in
      // anyway — this is a best-effort tidy-up, not a blocking step.
      const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))])
      try {
        // Scoped to the token this install registered. An unconditional clear
        // would let a browser or Android sign-out wipe the token an iPhone
        // registered, and the iPhone only rewrites it on next app launch —
        // silently killing push for that driver in the meantime.
        if (currentUser && myPushToken) {
          await withTimeout(
            sb.from('profiles').update({ push_token: null })
              .eq('id', currentUser.id).eq('push_token', myPushToken),
            3000,
          )
        }
        if (PushNotifications) await withTimeout(PushNotifications.removeAllListeners(), 1000)
      } catch (e) { console.error('Sign-out cleanup failed', e) }
      if (dispatchChannel) { sb.removeChannel(dispatchChannel); dispatchChannel = null }
      await sb.auth.signOut()
      window.location.href = 'index.html'
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length > 0) {
          Promise.all(regs.map(r => r.unregister())).then(() => window.location.reload())
        }
      })
    }
  </script>
</body>
</html>
