<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cooney's Trucking — My Truck</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#15161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #15161a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-img { height: 34px; width: auto; display: block; }
    .header-logo { font-size: 16px; font-weight: 900; color: #ffffff; letter-spacing: 1px; }
    .unit-badge {
      background: var(--brand-blue);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .btn-signout {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 40px;
      gap: 22px;
    }

    .status-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 4px solid rgba(255,255,255,0.1);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .status-ring.active {
      border-color: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,0.4);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
      70%  { box-shadow: 0 0 0 20px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .status-icon { font-size: 36px; }
    .status-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-ring.active .status-label { color: #22c55e; }
    /* Parked past the alert threshold. Amber, and deliberately NOT pulsing —
       the pulse means "we are hearing from you"; a stationary truck should
       look settled, not alarming. It is a heads-up, not a violation. */
    .status-ring.parked {
      border-color: #d97706;
      box-shadow: none;
      animation: none;
    }
    .status-ring.parked .status-label { color: #f59e0b; }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      width: 100%;
      max-width: 400px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 800;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .dispatch-address {
      font-size: 17px;
      font-weight: 700;
      color: #15161a;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }
    .dispatch-notes {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 4px;
    }
    .dispatch-empty {
      font-size: 14px;
      color: #9aa0a6;
      text-align: center;
      padding: 8px 0;
    }
    .accept-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0fdf4;
      color: #16a34a;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 9px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .card.dispatch-accepted { box-shadow: 0 0 0 2px #22c55e, 0 2px 10px rgba(0,0,0,0.06); }
    /* Buttons now live inside a dispatch card, which is already max-width 400
       and supplies the spacing — so no max-width and no negative margin here. */
    /* 20px, not 10px: these are tapped in a moving truck, and WCAG 2.5.8 wants
       at least 24px of target spacing. Mark Job Complete gets extra separation
       on top (see .btn-complete) because it is irreversible from the driver UI. */
    .card-actions { display: flex; flex-direction: column; gap: 20px; margin-top: 14px; }
    .btn-accept {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      /* Darker than the original #22c55e: that was chosen against the dark page
         shell (7.93:1 edge contrast). On the white card it fell to 2.28:1 — a
         pale slab in cab sunlight. #15803d restores 5.01:1 for both the edge and
         the white label. The old green is now the pressed state. */
      background: #15803d;
      color: #ffffff;
    }
    .btn-accept:active { background: #22c55e; }
    /* Solid fill, never opacity: compositing the button over the white card
       dropped the "Accepting..." label to 1.67:1 and the driver could not tell
       the tap had registered. */
    .btn-accept:disabled { background: #14532d; color: #ffffff; cursor: not-allowed; }

    /* Only shown when a driver has more than one open job, so the older one
       can never become unreachable. */
    .dispatch-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .job-count {
      width: 100%;
      max-width: 400px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .offline-note {
      width: 100%;
      max-width: 400px;
      background: rgba(234,179,8,0.15);
      color: #fde047;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }
    .offline-note.show { display: block; }

    .history-toggle {
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    .history-list { width: 100%; max-width: 400px; display: none; }
    .history-list.open { display: block; }
    .history-item {
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }
    .history-item .addr { font-weight: 700; color: #fff; margin-bottom: 2px; }
    .history-item .meta { color: rgba(255,255,255,0.4); }
    .history-item .status-cancelled { color: #f87171; }

    /* Trip breakdown. A bulk-haul job is a shuttle, not a trip: the driver
       runs the same two points all day. One "on job: 9h" line tells them
       nothing, so each run gets its own row with its own average speed. */
    .legs-toggle {
      background: none;
      border: none;
      color: var(--brand-blue-light);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 0 0;
      cursor: pointer;
    }
    .legs-body { display: none; margin-top: 10px; }
    .legs-body.open { display: block; }
    .legs-summary {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 8px;
    }
    .leg-row {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
      font-size: 12px;
      border-left: 2px solid rgba(255,255,255,0.12);
      padding-left: 10px;
      margin-left: 2px;
    }
    .leg-row.drive { border-left-color: var(--brand-blue-line); }
    .leg-row.stop { border-left-color: var(--stop-neutral); }
    .leg-row.stop.long { border-left-color: var(--stop-long); }
    .leg-row.stop.very-long { border-left-color: var(--stop-very-long); }
    .leg-row.gap { border-left-color: transparent; border-left-style: dashed; border-left-color: rgba(255,255,255,0.25); }
    .leg-row .when { color: rgba(255,255,255,0.35); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .leg-row .what { flex: 1; min-width: 0; color: rgba(255,255,255,0.85); }
    .leg-row .what .sub { display: block; color: rgba(255,255,255,0.4); font-size: 11px; }
    .leg-row .speed { flex-shrink: 0; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .leg-row.stop .speed { color: rgba(255,255,255,0.45); font-weight: 700; }

    .btn-directions {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      background: var(--brand-blue);
      color: #ffffff;
    }
    .btn-directions:active { background: var(--brand-blue-hover); }

    .btn-complete {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      /* Sits on the WHITE dispatch card, not the dark page shell — a
         translucent-white fill with white text would be invisible here. */
      background: #f4f5f7;
      color: #15161a;
      /* Extra separation from Get Directions: irreversible, and reached for
         while the truck is moving. ~34px total from the button above. */
      margin-top: 14px;
    }
    .btn-complete:active { background: #e4e6ea; }
    .btn-complete:disabled { background: #e4e6ea; color: #15161a; cursor: not-allowed; }

    .btn-track-toggle {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 4px;
    }

    /* --- Complete-job sheet -------------------------------------------------
       Replaces a bare confirm(). Completion is irreversible from the driver
       UI and now also carries an OPTIONAL photo, which a system dialog cannot
       express. Optional is the whole point: whether a photo is wanted depends
       on the job, and forcing one just teaches drivers to shoot the cab floor
       to get past the step. */
    .sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,11,14,0.66);
      z-index: 3000;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-overlay.open { display: flex; }
    .sheet-card {
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow-y: auto;
    }
    @media (min-width: 480px) {
      .sheet-overlay { align-items: center; }
      .sheet-card { border-radius: 16px; }
    }
    .sheet-title { font-size: 19px; font-weight: 800; color: #15161a; }
    .sheet-addr { font-size: 13px; color: #6c757d; margin-top: 4px; overflow-wrap: anywhere; }
    .sheet-label {
      font-size: 10.5px;
      font-weight: 800;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 20px 0 8px;
    }
    .sheet-hint { font-size: 12px; color: #9aa0a6; margin-top: -4px; margin-bottom: 8px; }
    .photo-actions { display: flex; gap: 10px; }
    .btn-photo {
      flex: 1;
      padding: 16px 10px;
      border: 1.5px dashed #c3c8ce;
      border-radius: 12px;
      background: #fafbfc;
      color: #15161a;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-photo:active { background: #eef1f4; }
    .photo-preview { margin-top: 4px; }
    .photo-preview img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #eef1f4;
    }
    .btn-photo-remove {
      background: none;
      border: none;
      color: #b91c1c;
      font-size: 12.5px;
      font-weight: 700;
      padding: 10px 0 0;
      cursor: pointer;
      font-family: inherit;
    }
    .sheet-error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 14px;
    }
    .sheet-error.show { display: block; }
    .sheet-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    .btn-sheet-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: #15803d;
      color: #ffffff;
      font-family: inherit;
    }
    .btn-sheet-primary:active { background: #22c55e; }
    .btn-sheet-primary:disabled { background: #14532d; color: #ffffff; cursor: not-allowed; }
    .btn-sheet-secondary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #f4f5f7;
      color: #15161a;
      font-family: inherit;
    }
    .btn-sheet-secondary:active { background: #e4e6ea; }

    /* Thumbnail in the driver's own job history. */
    .history-photo {
      margin-top: 8px;
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 4000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      width: 100%;
      max-width: 400px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <img src="logo.png" alt="Cooney's" class="header-img" width="51" height="34">
      <span class="unit-badge" id="unitBadge">UNIT —</span>
    </div>
    <button class="btn-signout" onclick="signOut()">Sign Out</button>
  </div>

  <div class="main">

    <div class="status-ring" id="statusRing">
      <div class="status-icon">📍</div>
      <div class="status-label" id="statusLabel">Starting...</div>
    </div>

    <div class="info-row">
      <span>Driver: <span id="infoName">—</span></span>
      <span id="infoLastSent">—</span>
    </div>

    <div class="offline-note" id="offlineNote">Offline — showing your last known jobs, retrying...</div>
    <div class="job-count" id="jobCount" style="display:none;"></div>
    <div class="dispatch-list" id="dispatchList">
      <div class="card">
        <div class="card-title">Current Dispatch</div>
        <div class="dispatch-empty">Loading...</div>
      </div>
    </div>

    <button class="btn-track-toggle" id="trackToggle" onclick="toggleTracking()">Pause GPS tracking</button>
    <button class="history-toggle" id="historyToggle" onclick="toggleHistory()">View recent jobs</button>
    <div class="history-list" id="historyList"></div>

  </div>

  <div class="sheet-overlay" id="completeSheet">
    <div class="sheet-card">
      <div class="sheet-title">Mark job complete?</div>
      <div class="sheet-addr" id="sheetAddr"></div>

      <div class="sheet-label">Photo — optional</div>
      <div class="sheet-hint">Load, site, or ticket. Skip it if the job doesn't need one.</div>
      <div class="photo-actions" id="photoActions">
        <button class="btn-photo" type="button" id="btnTakePhoto">Take Photo</button>
        <button class="btn-photo" type="button" id="btnPickPhoto">Choose Photo</button>
      </div>
      <div class="photo-preview" id="photoPreview" style="display:none;">
        <img id="photoImg" alt="Photo you attached to this job">
        <button class="btn-photo-remove" type="button" id="btnRemovePhoto">Remove photo</button>
      </div>

      <div class="sheet-error" id="sheetError"></div>

      <div class="sheet-actions">
        <button class="btn-sheet-primary" type="button" id="btnConfirmComplete">Mark Job Complete</button>
        <button class="btn-sheet-secondary" type="button" id="btnCancelComplete">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Browser fallback only. The native build goes through @capacitor/camera;
       these keep the web app usable for testing and for a dispatcher spot-check. -->
  <input type="file" accept="image/*" capture="environment" id="fileCamera" style="display:none;">
  <input type="file" accept="image/*" id="filePicker" style="display:none;">

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="Job photo, full size"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="legs.js"></script>
  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
    const BackgroundGeolocation = isNative ? window.Capacitor.Plugins.BackgroundGeolocation : null
    const PushNotifications = isNative ? window.Capacitor.Plugins.PushNotifications : null
    let currentUser = null
    let historyLoaded = false
    let historyById = {}
    let tracking = false
    let watchId = null
    let bgWatcherId = null
    let heartbeatTimer = null
    let wakeLock = null
    let lastPosition = null

    // --- Parked heartbeat ---------------------------------------------------
    // distanceFilter is metres-based, so a parked truck used to write NOTHING:
    // the app went completely silent for the whole time it was sitting at a
    // pit, a site, or wherever the driver decided to sit. That silence is
    // indistinguishable from a dead phone, and it made per-leg times and idle
    // detection impossible. So while the watcher is quiet we re-log the LAST
    // KNOWN fix on a timer — presence, not a fresh (expensive) GPS lock.
    const HEARTBEAT_MS = 90 * 1000       // how often a parked truck reports in
    const HEARTBEAT_TICK_MS = 30 * 1000  // how often we check whether one is due
    const BROWSER_MIN_MOVE_M = 40        // mirrors the native distanceFilter
    const PARKED_NOTICE_MS = 10 * 60 * 1000 // matches the server-side idle alert
    const PARKED_RADIUS_M = 150             // ...and its dwell radius
    let lastFix = null        // newest known coordinates, movement or heartbeat
    let lastSentAt = 0        // when we last wrote a row
    let lastSentFix = null    // the coordinates of that row
    let parkedAnchor = null   // where the truck settled
    let parkedSince = 0       // ...and when
    // ALL open jobs, not just the newest — a second dispatch must never hide the
    // first. Renders as a single card when there is only one, as today.
    let activeDispatches = []
    // Monotonic guard: realtime, the 30s poll and post-action reloads can all be
    // in flight at once, and a slow earlier response must not overwrite a newer one.
    let loadSeq = 0
    let dispatchChannel = null
    // Set from a notification tap so we scroll to the job the driver chose.
    let focusDispatchId = null
    // Re-rendering rebuilds innerHTML and destroys any in-progress button state
    // ("Accepting...", disabled). The 30s poll and realtime both call in, so skip
    // the rebuild when nothing the driver can see has actually changed.
    let lastRenderSig = ''
    let hasRenderedOnce = false
    // The APNs token THIS install registered. Sign-out only ever clears its own
    // device's token — a browser or Android session must not wipe the token an
    // iPhone registered, because the iPhone only rewrites it on app launch.
    let myPushToken = null

    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) { window.location.href = 'index.html'; return }
      currentUser = session.user
      const { data: profile } = await sb.from('profiles').select('full_name, unit_number, role').eq('id', session.user.id).single()
      if (profile?.role === 'admin' || profile?.role === 'dispatcher') { window.location.href = 'dispatcher.html'; return }
      document.getElementById('infoName').textContent = profile?.full_name || 'Unknown'
      document.getElementById('unitBadge').textContent = 'UNIT ' + (profile?.unit_number || '—')
      loadDispatch()
      setInterval(loadDispatch, 30000)
      startTracking()
      registerPush()

      // Realtime: reflect a new dispatch or a dispatcher-side change the moment
      // it happens, instead of waiting up to 30s for the next poll.
      dispatchChannel = sb.channel('dispatches-driver-' + currentUser.id)
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'dispatches',
          filter: 'driver_id=eq.' + currentUser.id
        }, () => { historyLoaded = false; loadDispatch() })
        .subscribe()
    })

    window.addEventListener('pagehide', () => {
      if (dispatchChannel) { sb.removeChannel(dispatchChannel); dispatchChannel = null }
    })

    function setOffline(on, msg) {
      const el = document.getElementById('offlineNote')
      el.textContent = msg || 'Offline — showing your last known jobs, retrying...'
      el.classList.toggle('show', !!on)
    }

    async function registerPush() {
      if (!isNative || !PushNotifications) return
      // Push is iOS-only. The Edge Function speaks APNs, and there is no
      // google-services.json wired up for FCM — on Android register() throws
      // inside Firebase init and the catch below would swallow it silently.
      // Note POST_NOTIFICATIONS is already granted for the GPS foreground
      // service, so the permission check below would NOT have caught this.
      const platform = window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : ''
      if (platform !== 'ios') return
      try {
        let perm = await PushNotifications.checkPermissions()
        if (perm.receive !== 'granted') perm = await PushNotifications.requestPermissions()
        if (perm.receive !== 'granted') return

        PushNotifications.addListener('registration', async (token) => {
          myPushToken = token.value
          await sb.from('profiles').update({ push_token: token.value }).eq('id', currentUser.id)
        })
        PushNotifications.addListener('registrationError', (err) => {
          console.error('Push registration error', err)
        })
        PushNotifications.addListener('pushNotificationReceived', () => loadDispatch())
        // Open the job the driver actually tapped. The payload carries
        // dispatch_id precisely so this doesn't fall back to "whichever is newest".
        PushNotifications.addListener('pushNotificationActionPerformed', (action) => {
          const id = action && action.notification && action.notification.data
            ? action.notification.data.dispatch_id
            : null
          if (id) focusDispatchId = id
          loadDispatch()
        })

        await PushNotifications.register()
      } catch (e) {
        console.error('Could not set up push notifications', e)
      }
    }

    async function loadDispatch() {
      const seq = ++loadSeq
      const { data, error } = await sb.from('dispatches')
        .select('*')
        .eq('driver_id', currentUser.id)
        .eq('status', 'active')
        .order('created_at', { ascending: false })
        .limit(20)

      // A newer load already rendered — discard this stale response.
      if (seq !== loadSeq) return

      // supabase-js RESOLVES with {data:null, error} on a network failure rather
      // than throwing. Rendering that as "no dispatch" would wipe a real job off
      // the screen of a driver in a dead zone, so keep the last known state.
      if (error) {
        setOffline(true)
        // On a cold start with no signal there is nothing to preserve, and the
        // placeholder would otherwise read "Loading..." forever.
        if (!hasRenderedOnce) {
          document.getElementById('dispatchList').innerHTML =
            '<div class="card"><div class="card-title">Current Dispatch</div><div class="dispatch-empty">No connection — retrying every 30s.</div></div>'
        }
        return
      }

      setOffline(false)
      activeDispatches = data || []
      renderDispatches()
    }

    function renderDispatches() {
      const list = document.getElementById('dispatchList')
      const countEl = document.getElementById('jobCount')

      const sig = JSON.stringify(activeDispatches.map(d => [d.id, d.accepted_at, d.site_address, d.notes, d.lat, d.lng]))
      if (sig === lastRenderSig && hasRenderedOnce && !focusDispatchId) return
      lastRenderSig = sig
      hasRenderedOnce = true

      if (activeDispatches.length === 0) {
        focusDispatchId = null
        countEl.style.display = 'none'
        list.innerHTML = '<div class="card"><div class="card-title">Current Dispatch</div><div class="dispatch-empty">No dispatch assigned</div></div>'
        return
      }

      const many = activeDispatches.length > 1
      countEl.style.display = many ? 'block' : 'none'
      countEl.textContent = activeDispatches.length + ' open jobs'

      list.innerHTML = activeDispatches.map((d, i) => {
        const accepted = !!d.accepted_at
        const id = escapeHtml(d.id)
        return `
          <div class="card ${accepted ? 'dispatch-accepted' : ''}" data-dispatch="${id}">
            <div class="card-title">${many ? 'Job ' + (i + 1) : 'Current Dispatch'}</div>
            ${accepted ? '<div class="accept-badge">✓ Accepted</div>' : ''}
            <div class="dispatch-address">${escapeHtml(d.site_address)}</div>
            ${d.notes ? `<div class="dispatch-notes">${escapeHtml(d.notes)}</div>` : ''}
            <div class="card-actions">
              ${accepted ? '' : `<button class="btn-accept" data-action="accept" data-id="${id}">Accept Dispatch</button>`}
              <button class="btn-directions" data-action="directions" data-id="${id}">Get Directions</button>
              <button class="btn-complete" data-action="complete" data-id="${id}">Mark Job Complete</button>
            </div>
          </div>
        `
      }).join('')

      if (focusDispatchId) {
        for (const el of list.children) {
          if (el.dataset.dispatch === focusDispatchId) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' })
            break
          }
        }
      }
      // Cleared on every render path, so a tap can never be applied to an
      // unrelated later render.
      focusDispatchId = null
    }

    // Delegated: values go in data-* attributes rather than being interpolated
    // into an inline onclick. HTML-escaping does not make a value safe inside a
    // JS string literal — the parser decodes entities before the JS is compiled.
    document.getElementById('dispatchList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]')
      if (!btn) return
      const id = btn.dataset.id
      if (btn.dataset.action === 'accept') acceptDispatch(id, btn)
      else if (btn.dataset.action === 'directions') getDirections(id)
      else if (btn.dataset.action === 'complete') markComplete(id, btn)
    })

    async function acceptDispatch(id, btn) {
      const d = activeDispatches.find(x => x.id === id)
      if (!d) return
      btn.disabled = true
      btn.textContent = 'Accepting...'
      const { error } = await sb.from('dispatches')
        .update({ accepted_at: new Date().toISOString() })
        .eq('id', id)
      if (error) {
        btn.disabled = false
        btn.textContent = 'Accept Dispatch'
        setOffline(true, 'Could not accept — no connection. Try again when you have signal.')
        return
      }
      setOffline(false)
      // Re-find rather than mutating the captured `d`: a concurrent load may have
      // replaced activeDispatches while the update was in flight, which would
      // leave the optimistic accept on an orphaned object and never render.
      const cur = activeDispatches.find(x => x.id === id)
      if (cur) cur.accepted_at = new Date().toISOString()
      renderDispatches()
      loadDispatch()
    }

    async function toggleHistory() {
      const list = document.getElementById('historyList')
      const open = list.classList.toggle('open')
      document.getElementById('historyToggle').textContent = open ? 'Hide recent jobs' : 'View recent jobs'
      if (open && !historyLoaded) await loadHistory()
    }

    async function loadHistory() {
      const list = document.getElementById('historyList')
      list.innerHTML = '<div class="history-item">Loading...</div>'
      const { data, error } = await sb.from('dispatches')
        .select('*')
        .eq('driver_id', currentUser.id)
        .in('status', ['completed', 'cancelled'])
        .order('created_at', { ascending: false })
        .limit(10)

      if (error) {
        list.innerHTML = '<div class="history-item">Could not load recent jobs — tap again when you have signal.</div>'
        return
      }
      historyLoaded = true
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="history-item">No past jobs yet</div>'
        return
      }
      historyById = {}
      data.forEach(d => { historyById[d.id] = d })
      list.innerHTML = data.map(d => {
        const timeStr = new Date(d.completed_at || d.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
        const statusStr = d.status === 'cancelled' ? '<span class="status-cancelled">Cancelled</span>' : 'Completed'
        const id = escapeHtml(d.id)
        return `
          <div class="history-item">
            <div class="addr">${escapeHtml(d.site_address)}</div>
            <div class="meta">${statusStr} · ${timeStr}</div>
            ${d.completion_photo_path ? `<img class="history-photo" data-photo="${escapeHtml(d.completion_photo_path)}" alt="Photo attached to this job">` : ''}
            <button class="legs-toggle" data-legs="${id}">Show trip breakdown</button>
            <div class="legs-body" data-legs-body="${id}"></div>
          </div>
        `
      }).join('')
      hydratePhotos(list)
    }

    // Signed URLs are minted after the list paints, so a slow storage call
    // never delays the job history itself.
    async function hydratePhotos(root) {
      const imgs = root.querySelectorAll('img[data-photo]')
      for (const img of imgs) {
        const url = await signedPhotoUrl(img.dataset.photo)
        if (url) img.src = url
        else img.remove()
      }
    }

    document.getElementById('historyList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-legs]')
      if (btn) { toggleLegs(btn.dataset.legs, btn); return }
      const img = e.target.closest('img[data-photo]')
      if (img && img.src) openLightbox(img.src)
    })

    async function toggleLegs(id, btn) {
      const body = document.querySelector('[data-legs-body="' + CSS.escape(id) + '"]')
      if (!body) return
      const open = body.classList.toggle('open')
      btn.textContent = open ? 'Hide trip breakdown' : 'Show trip breakdown'
      if (!open || body.dataset.loaded === '1') return
      const d = historyById[id]
      if (!d) return
      body.innerHTML = '<div class="legs-summary">Working out your trips...</div>'
      try {
        const from = new Date(d.accepted_at || d.created_at).toISOString()
        const to = new Date(d.completed_at || Date.now()).toISOString()
        const { rows } = await TruckLegs.fetchPings(sb, currentUser.id, from, to)
        const anchors = (d.lat != null && d.lng != null)
          ? [{ lat: d.lat, lng: d.lng, label: 'Site' }] : []
        body.innerHTML = renderLegs(TruckLegs.segment(rows, { anchors }))
        body.dataset.loaded = '1'
      } catch (err) {
        console.error('Leg breakdown failed', err)
        body.innerHTML = '<div class="legs-summary">Could not load your trips — tap again when you have signal.</div>'
      }
    }

    function renderLegs(r) {
      const s = r.summary
      if (!s.legCount && !s.stopCount) {
        return '<div class="legs-summary">No GPS recorded for this job.</div>'
      }
      const head = `<div class="legs-summary">${s.legCount} trip${s.legCount === 1 ? '' : 's'} · `
        + `${TruckLegs.fmtDuration(s.drivingMs)} driving · ${TruckLegs.fmtDistance(s.distanceM)} · `
        + `${TruckLegs.fmtSpeed(s.avgKph)} average</div>`
      return head + r.segments.map(seg => {
        const when = `${TruckLegs.fmtClock(seg.startAt)}–${TruckLegs.fmtClock(seg.endAt)}`
        if (seg.type === 'leg') {
          const route = (seg.fromLabel && seg.toLabel)
            ? `${escapeHtml(seg.fromLabel)} → ${escapeHtml(seg.toLabel)}` : 'Driving'
          return `<div class="leg-row drive">
              <span class="when">${when}</span>
              <span class="what">${route}<span class="sub">${TruckLegs.fmtDuration(seg.durationMs)} · ${TruckLegs.fmtDistance(seg.distanceM)}</span></span>
              <span class="speed">${TruckLegs.fmtSpeed(seg.avgKph)}</span>
            </div>`
        }
        if (seg.type === 'stop') {
          const cls = seg.veryLong ? ' very-long' : (seg.long ? ' long' : '')
          return `<div class="leg-row stop${cls}">
              <span class="when">${when}</span>
              <span class="what">Stopped${seg.stopLabel ? ' at ' + escapeHtml(seg.stopLabel) : ''}</span>
              <span class="speed">${TruckLegs.fmtDuration(seg.durationMs)}</span>
            </div>`
        }
        return `<div class="leg-row gap">
            <span class="when">${when}</span>
            <span class="what">No GPS recorded<span class="sub">Phone out of coverage or app closed</span></span>
            <span class="speed">${TruckLegs.fmtDuration(seg.durationMs)}</span>
          </div>`
      }).join('')
    }

    function getDirections(id) {
      const d = activeDispatches.find(x => x.id === id)
      if (!d) return
      const dest = (d.lat != null && d.lng != null)
        ? `${d.lat},${d.lng}`
        : encodeURIComponent(d.site_address)
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}`, '_blank')
    }

    // --- Complete a job, optionally with a photo -----------------------------
    let pendingComplete = null      // { id, btn } while the sheet is open
    let pendingPhotoDataUrl = null  // the chosen image, not yet uploaded

    function markComplete(id, btn) {
      if (!activeDispatches.some(x => x.id === id)) return
      const d = activeDispatches.find(x => x.id === id)
      pendingComplete = { id: id, btn: btn }
      pendingPhotoDataUrl = null
      document.getElementById('sheetAddr').textContent = d ? d.site_address : ''
      setPhotoPreview(null)
      sheetError('')
      const confirmBtn = document.getElementById('btnConfirmComplete')
      confirmBtn.disabled = false
      confirmBtn.textContent = 'Mark Job Complete'
      document.getElementById('completeSheet').classList.add('open')
    }

    function closeCompleteSheet() {
      document.getElementById('completeSheet').classList.remove('open')
      pendingComplete = null
      pendingPhotoDataUrl = null
      setPhotoPreview(null)
    }

    function sheetError(msg) {
      const el = document.getElementById('sheetError')
      el.textContent = msg || ''
      el.classList.toggle('show', !!msg)
    }

    function setPhotoPreview(dataUrl) {
      const wrap = document.getElementById('photoPreview')
      const actions = document.getElementById('photoActions')
      if (dataUrl) {
        document.getElementById('photoImg').src = dataUrl
        wrap.style.display = 'block'
        actions.style.display = 'none'
      } else {
        document.getElementById('photoImg').removeAttribute('src')
        wrap.style.display = 'none'
        actions.style.display = 'flex'
      }
    }

    document.getElementById('btnCancelComplete').addEventListener('click', closeCompleteSheet)
    document.getElementById('completeSheet').addEventListener('click', (e) => {
      if (e.target.id === 'completeSheet') closeCompleteSheet()
    })
    document.getElementById('btnRemovePhoto').addEventListener('click', () => {
      pendingPhotoDataUrl = null
      setPhotoPreview(null)
      sheetError('')
    })
    document.getElementById('btnTakePhoto').addEventListener('click', () => choosePhoto('camera'))
    document.getElementById('btnPickPhoto').addEventListener('click', () => choosePhoto('library'))
    document.getElementById('btnConfirmComplete').addEventListener('click', doComplete)

    async function choosePhoto(mode) {
      sheetError('')
      const Camera = isNative && window.Capacitor.Plugins ? window.Capacitor.Plugins.Camera : null
      if (Camera) {
        try {
          // Bounded on the device rather than after upload: drivers are on cell
          // data, often at the edge of coverage, and a 12 MP original is a
          // several-megabyte upload that will simply never finish out there.
          const photo = await Camera.getPhoto({
            quality: 70,
            width: 1600,
            allowEditing: false,
            correctOrientation: true,
            resultType: 'dataUrl',
            source: mode === 'camera' ? 'CAMERA' : 'PHOTOS',
            saveToGallery: false
          })
          if (photo && photo.dataUrl) {
            pendingPhotoDataUrl = photo.dataUrl
            setPhotoPreview(photo.dataUrl)
          }
        } catch (e) {
          // The plugin throws on a plain user cancel too, which is not an error
          // worth showing. Anything else is a permission problem worth naming.
          const msg = (e && e.message) || ''
          if (!/cancel/i.test(msg)) {
            sheetError('Could not open the camera. Check the app has camera and photo permission in Settings.')
          }
        }
        return
      }
      // Browser fallback.
      document.getElementById(mode === 'camera' ? 'fileCamera' : 'filePicker').click()
    }

    ;['fileCamera', 'filePicker'].forEach(id => {
      document.getElementById(id).addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0]
        e.target.value = '' // let the same file be re-picked after a Remove
        if (!file) return
        try {
          const raw = await fileToDataUrl(file)
          // Only the browser path needs this — @capacitor/camera already caps
          // the dimension and re-encodes on device.
          pendingPhotoDataUrl = await downscaleDataUrl(raw, 1600, 0.7)
          setPhotoPreview(pendingPhotoDataUrl)
        } catch (err) {
          console.error('Photo read failed', err)
          sheetError('Could not read that photo. Try another one.')
        }
      })
    })

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader()
        fr.onload = () => resolve(fr.result)
        fr.onerror = () => reject(fr.error || new Error('read failed'))
        fr.readAsDataURL(file)
      })
    }

    function downscaleDataUrl(dataUrl, maxDim, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image()
        img.onload = () => {
          try {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height))
            if (scale === 1 && /^data:image\/jpeg/.test(dataUrl)) return resolve(dataUrl)
            const c = document.createElement('canvas')
            c.width = Math.round(img.width * scale)
            c.height = Math.round(img.height * scale)
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
            resolve(c.toDataURL('image/jpeg', quality))
          } catch (e) { reject(e) }
        }
        img.onerror = () => reject(new Error('decode failed'))
        img.src = dataUrl
      })
    }

    function dataUrlToBlob(dataUrl) {
      const comma = dataUrl.indexOf(',')
      const meta = dataUrl.slice(0, comma)
      const type = (meta.match(/data:([^;]+)/) || [])[1] || 'image/jpeg'
      const bin = atob(dataUrl.slice(comma + 1))
      const bytes = new Uint8Array(bin.length)
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
      return new Blob([bytes], { type: type })
    }

    // crypto.randomUUID is iOS 15.4+; this app still supports older phones in
    // the cab, so do not depend on it for a filename.
    function photoId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10)
    }

    async function doComplete() {
      if (!pendingComplete) return
      const { id, btn } = pendingComplete
      const confirmBtn = document.getElementById('btnConfirmComplete')
      confirmBtn.disabled = true
      sheetError('')

      let photoPath = null
      if (pendingPhotoDataUrl) {
        confirmBtn.textContent = 'Uploading photo...'
        try {
          const blob = dataUrlToBlob(pendingPhotoDataUrl)
          // Path starts with the driver's own id — that first segment is what
          // the storage RLS policy checks, so nothing here trusts a client
          // field to decide who owns the object.
          const path = `${currentUser.id}/${id}/${photoId()}.jpg`
          const { error: upErr } = await sb.storage.from('job-photos')
            .upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert: false })
          if (upErr) throw upErr
          photoPath = path
        } catch (e) {
          console.error('Photo upload failed', e)
          // Never hold a job open because a photo would not upload. The driver
          // is frequently in a dead zone at exactly this moment, and an
          // uncompletable job is a far worse failure than a missing photo.
          confirmBtn.disabled = false
          confirmBtn.textContent = 'Complete without photo'
          sheetError('The photo would not upload — probably no signal. Tap again to complete this job without it.')
          pendingPhotoDataUrl = null
          setPhotoPreview(null)
          return
        }
      }

      confirmBtn.textContent = 'Marking complete...'
      const patch = { status: 'completed', completed_at: new Date().toISOString() }
      if (photoPath) patch.completion_photo_path = photoPath
      const { error } = await sb.from('dispatches').update(patch).eq('id', id)

      if (error) {
        confirmBtn.disabled = false
        confirmBtn.textContent = 'Mark Job Complete'
        sheetError('Could not mark complete — no connection. Try again when you have signal.')
        setOffline(true, 'Could not mark complete — no connection. Try again when you have signal.')
        return
      }

      setOffline(false)
      closeCompleteSheet()
      if (btn) { btn.disabled = true; btn.textContent = 'Marking complete...' }
      historyLoaded = false
      activeDispatches = activeDispatches.filter(x => x.id !== id)
      renderDispatches()
      loadDispatch()
    }

    // --- Viewing a photo -----------------------------------------------------
    // Objects are private, so every view needs a short-lived signed URL.
    const signedUrlCache = {}
    async function signedPhotoUrl(path) {
      if (signedUrlCache[path]) return signedUrlCache[path]
      const { data, error } = await sb.storage.from('job-photos').createSignedUrl(path, 3600)
      if (error || !data) return null
      signedUrlCache[path] = data.signedUrl
      return data.signedUrl
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src
      document.getElementById('lightbox').classList.add('open')
    }
    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('open')
      document.getElementById('lightboxImg').removeAttribute('src')
    })

    async function toggleTracking() {
      tracking ? stopTracking() : startTracking()
    }

    async function startTracking() {
      // Native app (installed on the phone): real background tracking via the
      // OS location service, keeps running with the screen off / app closed.
      if (isNative && BackgroundGeolocation) {
        try {
          bgWatcherId = await BackgroundGeolocation.addWatcher(
            {
              backgroundTitle: 'Tracking your truck',
              backgroundMessage: "Cooney's Truck Tracker is running. Tap to open.",
              requestPermissions: true,
              stale: false,
              // Metres between updates, not a fixed timer — fires roughly every
              // 3-10s at normal driving speeds and goes silent while parked.
              // That silence used to mean the app reported NOTHING for a truck
              // sitting at a pit; startHeartbeat() now fills it in. Keep the
              // two together: raising this without the heartbeat re-creates the
              // blind spot, and per-leg times depend on the trail being
              // continuous. Verify heartbeats are really reaching a device with
              //   select source, count(*) from location_updates
              //   where user_id = '...' group by 1;
              // — the app is fully bundled, so a device on an older build will
              // show no 'heartbeat' rows at all until it is reinstalled.
              distanceFilter: 40
            },
            (location, error) => {
              if (error) {
                if (error.code === 'NOT_AUTHORIZED') {
                  if (confirm("This app needs location access to track your truck. Open settings now?")) {
                    BackgroundGeolocation.openSettings()
                  }
                }
                document.getElementById('statusLabel').textContent = 'GPS error'
                return
              }
              if (!tracking) firstActivate()
              // The watcher only fires once the truck has moved distanceFilter
              // metres, so every callback here is by definition movement.
              sendLocation({
                coords: {
                  latitude: location.latitude,
                  longitude: location.longitude,
                  accuracy: location.accuracy,
                  speed: location.speed,
                  heading: location.bearing
                }
              }, 'move')
            }
          )
          tracking = true
          startHeartbeat()
          document.getElementById('trackToggle').textContent = 'Pause GPS tracking'
        } catch (e) {
          alert('Could not start location tracking: ' + e.message)
        }
        return
      }

      // Browser fallback (testing on the web build): foreground-only, screen
      // must stay on and the tab open — the wake lock keeps the screen alive.
      if (!navigator.geolocation) {
        alert('GPS is not available on this device.')
        return
      }

      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen')
      } catch (e) {}

      watchId = navigator.geolocation.watchPosition(
        pos => {
          lastPosition = pos
          if (!tracking) firstActivate()
          // watchPosition fires roughly once a second, so writing every
          // callback floods the table. Throttle to the same 40m the native
          // watcher uses and let the heartbeat cover standing still — the two
          // platforms then produce comparable trails to segment.
          const moved = !lastSentFix || distanceM(
            lastSentFix.lat, lastSentFix.lng, pos.coords.latitude, pos.coords.longitude
          ) >= BROWSER_MIN_MOVE_M
          if (moved) sendLocation(pos, 'move')
          else noteFix(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, pos.coords.speed, pos.coords.heading)
        },
        err => {
          document.getElementById('statusLabel').textContent = 'GPS error'
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
      )

      tracking = true
      startHeartbeat()
      document.getElementById('trackToggle').textContent = 'Pause GPS tracking'
    }

    function distanceM(aLat, aLng, bLat, bLng) {
      // Fail OPEN if legs.js somehow did not load: Infinity means "treat every
      // fix as movement", which degrades to the old send-everything behaviour
      // and to no parked indicator. Returning 0 would have silently stopped
      // the driver reporting at all, which is far worse.
      return (window.TruckLegs && TruckLegs.haversine)
        ? TruckLegs.haversine(aLat, aLng, bLat, bLng)
        : Number.POSITIVE_INFINITY
    }

    // Remember where we are without necessarily writing a row.
    function noteFix(lat, lng, accuracy, speed, heading) {
      lastFix = { lat: lat, lng: lng, accuracy: accuracy, speed: speed, heading: heading }
      if (!parkedAnchor || distanceM(parkedAnchor.lat, parkedAnchor.lng, lat, lng) > PARKED_RADIUS_M) {
        parkedAnchor = { lat: lat, lng: lng }
        parkedSince = Date.now()
      }
    }

    function startHeartbeat() {
      if (heartbeatTimer) return
      heartbeatTimer = setInterval(() => {
        if (!tracking) return
        // Re-log the last known position rather than forcing a fresh GPS lock.
        // The truck is not moving; the point is to prove the app is alive and
        // the truck is still here, which costs a row, not a radio.
        if (lastFix && Date.now() - lastSentAt >= HEARTBEAT_MS) {
          sendLocation({ coords: {
            latitude: lastFix.lat, longitude: lastFix.lng,
            accuracy: lastFix.accuracy, speed: 0, heading: lastFix.heading
          } }, 'heartbeat')
        }
        renderTrackingStatus()
      }, HEARTBEAT_TICK_MS)
    }

    // Tell the driver what the office is seeing. A truck that has been sitting
    // for 10 minutes is about to generate an alert; showing that on their own
    // screen first makes the alert land as a nudge rather than an ambush.
    function renderTrackingStatus() {
      if (!tracking) return
      const ring = document.getElementById('statusRing')
      const label = document.getElementById('statusLabel')
      const parkedMs = parkedSince ? Date.now() - parkedSince : 0
      if (parkedSince && parkedMs >= PARKED_NOTICE_MS) {
        ring.classList.remove('active')
        ring.classList.add('parked')
        label.textContent = 'Parked ' + Math.round(parkedMs / 60000) + ' min'
      } else {
        ring.classList.remove('parked')
        ring.classList.add('active')
        label.textContent = 'Live'
      }
    }

    function firstActivate() {
      document.getElementById('statusRing').classList.add('active')
      document.getElementById('statusLabel').textContent = 'Live'
    }

    async function stopTracking() {
      if (isNative && BackgroundGeolocation && bgWatcherId) {
        try { await BackgroundGeolocation.removeWatcher({ id: bgWatcherId }) } catch (e) {}
        bgWatcherId = null
      }
      if (watchId !== null) navigator.geolocation.clearWatch(watchId)
      if (heartbeatTimer) clearInterval(heartbeatTimer)
      if (wakeLock) { try { wakeLock.release() } catch(e) {} wakeLock = null }
      tracking = false
      watchId = null
      heartbeatTimer = null
      lastPosition = null
      lastFix = null
      parkedAnchor = null
      parkedSince = 0
      document.getElementById('statusRing').classList.remove('parked')
      document.getElementById('statusRing').classList.remove('active')
      document.getElementById('statusLabel').textContent = 'Paused'
      document.getElementById('trackToggle').textContent = 'Resume GPS tracking'
    }

    async function sendLocation(pos, source) {
      const lat = pos.coords.latitude
      const lng = pos.coords.longitude
      noteFix(lat, lng, pos.coords.accuracy, pos.coords.speed, pos.coords.heading)
      const { error } = await sb.from('location_updates').insert({
        user_id: currentUser.id,
        lat: lat,
        lng: lng,
        accuracy: pos.coords.accuracy,
        speed: pos.coords.speed,
        heading: pos.coords.heading,
        source: source || 'move'
      })
      if (!error) {
        // Only advance the heartbeat clock on a row that actually landed. If
        // the driver is in a dead zone every insert fails, and pretending
        // otherwise would suppress the retry the next tick would have made.
        lastSentAt = Date.now()
        lastSentFix = { lat: lat, lng: lng }
        document.getElementById('infoLastSent').textContent = 'Last ping ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
      renderTrackingStatus()
    }

    async function signOut() {
      await stopTracking()
      // Release this device's push token. An APNs token identifies the app
      // INSTALL, not the user — on a shared cab phone the next driver to sign in
      // would otherwise inherit our notifications, and we'd stop getting ours.
      // Time-boxed: a driver on a dead connection must still be able to sign out.
      // If the clear does not land, the token is overwritten on the next sign-in
      // anyway — this is a best-effort tidy-up, not a blocking step.
      const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))])
      try {
        // Scoped to the token this install registered. An unconditional clear
        // would let a browser or Android sign-out wipe the token an iPhone
        // registered, and the iPhone only rewrites it on next app launch —
        // silently killing push for that driver in the meantime.
        if (currentUser && myPushToken) {
          await withTimeout(
            sb.from('profiles').update({ push_token: null })
              .eq('id', currentUser.id).eq('push_token', myPushToken),
            3000,
          )
        }
        if (PushNotifications) await withTimeout(PushNotifications.removeAllListeners(), 1000)
      } catch (e) { console.error('Sign-out cleanup failed', e) }
      if (dispatchChannel) { sb.removeChannel(dispatchChannel); dispatchChannel = null }
      await sb.auth.signOut()
      window.location.href = 'index.html'
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        if (regs.length > 0) {
          Promise.all(regs.map(r => r.unregister())).then(() => window.location.reload())
        }
      })
    }
  </script>
</body>
</html>
